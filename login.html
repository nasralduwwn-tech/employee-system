{% extends "base.html" %}
{% block title %}تسجيل الدخول - مكتب خدمات عامة{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-building" style="font-size: 3rem; color: #2c5282;"></i>
                <h3 class="mt-2">مكتب خدمات عامة</h3>
                <p class="text-muted">نظام إدارة الموظفين والفواتير</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">دخول</button>
            </form>
            <hr>
            <div class="small text-muted">
                <strong>حسابات تجريبية:</strong><br>
                المدير: admin / admin123<br>
                موظف 1: emp1 / 123456<br>
                موظف 2: emp2 / 123456<br>
                موظف 3: emp3 / 123456
            </div>
        </div>
    </div>
</div>
{% endblock %}
