{% extends "base.html" %}
{% block title %}إنشاء فاتورة{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h4 class="mb-4"><i class="bi bi-receipt"></i> إنشاء فاتورة جديدة</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم العميل <span class="text-danger">*</span></label>
                    <input type="text" name="client_name" class="form-control form-control-lg" required placeholder="اسم العميل أو الشركة">
                </div>
                <div class="mb-3">
                    <label class="form-label">وصف الخدمة <span class="text-danger">*</span></label>
                    <textarea name="service_desc" class="form-control" rows="4" required placeholder="مثال: استخراج شهادة، تصديق أوراق، خدمة حكومية..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">المبلغ (ريال) <span class="text-danger">*</span></label>
                    <input type="number" name="amount" class="form-control form-control-lg" step="0.01" min="0.01" required placeholder="0.00">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                        <i class="bi bi-check-circle"></i> إنشاء الفاتورة وتحميل PDF
                    </button>
                    <a href="{{ url_for('employee_dashboard') }}" class="btn btn-outline-secondary btn-lg">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
